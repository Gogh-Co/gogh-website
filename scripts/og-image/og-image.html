<!doctype html>
<!--
  Source of public/og-image.png (1200x630 social share card).
  Re-render from the repo root, then bump SITE_IMAGE's ?v= in app/utils/site.ts:
    google-chrome --headless=new --hide-scrollbars --allow-file-access-from-files \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot=public/og-image.png "file://$PWD/scripts/og-image/og-image.html"
    optipng -o2 public/og-image.png
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Roboto'; font-weight: 300; src: url('../../node_modules/@fontsource/roboto/files/roboto-latin-300-normal.woff2') format('woff2'); }
@font-face { font-family: 'Roboto'; font-weight: 400; src: url('../../node_modules/@fontsource/roboto/files/roboto-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Roboto Mono'; font-weight: 400; src: url('../../node_modules/@fontsource/roboto-mono/files/roboto-mono-latin-400-normal.woff2') format('woff2'); }

html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0D1926; }
.card { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: #0D1926; color: #F4EFE6; font-family: 'Roboto', sans-serif; }
.head { display: flex; justify-content: space-between; align-items: center;
    font-family: 'Roboto Mono', monospace; font-size: 22px; color: rgba(244, 239, 230, 0.5); }
.head b { font-weight: 400; color: #F4EFE6; }
.word { margin: 0; font-weight: 400; font-size: 188px; line-height: 0.8; letter-spacing: -0.045em; }
.sub { margin: 62px 0 0; font-weight: 300; font-size: 46px; line-height: 1.1; letter-spacing: -0.02em; color: rgba(244, 239, 230, 0.62); }
.palette { display: grid; grid-template-columns: repeat(16, 1fr); gap: 0; height: 18px; }
</style>
</head>
<body>
<div class="card">
    <div class="head"><b>gogh.website</b><span>$ bash -c "$(wget -qO- gogh.website/gogh)"</span></div>
    <div>
        <h1 class="word">Gogh</h1>
        <p class="sub">Color schemes for your terminal.</p>
    </div>
    <div class="palette" id="palette"></div>
</div>
<script>
// The Gogh logo palette: normal colors, then bright.
const LOGO = ['#243342','#C54133','#27AE60','#EDB20A','#2479D0','#7D3EA0','#1D8579','#C9CCCD',
              '#34495E','#E74C3C','#2ECC71','#F1C40F','#3498DB','#9B59B6','#2AA198','#ECF0F1'];
for (const c of LOGO) {
    const s = document.createElement('span');
    s.style.background = c;
    document.getElementById('palette').appendChild(s);
}
</script>
</body>
</html>
